# ============================================================
#  ADO Pipeline – mirrored from terraform.yml (GitHub Actions)
#  Refactored for WINDOWS self-hosted agents
# ============================================================

trigger:
  branches:
    include:
      - master
      - feature
  paths:
    include:
      - '**/*.tf'

pr:
  branches:
    include:
      - master

# ── Pipeline-level variables ─────────────────────────────────
variables:
  azureServiceConnection: 'Velociraptor-Auth'
  backendResourceGroup:   'rg-terraform-state'
  backendStorageAccount:  'sttfstatedev001'
  backendContainer:       'tfstate'
  backendKey:             'practice.terraform.tfstate'
  TF_WORKING_DIR:         '$(System.DefaultWorkingDirectory)/terraform-pipeline/terraform'
  environmentName:        'production-approval'

pool:
  name: 'Velociraptor-Agent'

# ============================================================
#  STAGE 1 – Terraform Init, Format, Validate & Plan
#             + TFLint + Infracost
# ============================================================
stages:
  - stage: TerraformPlan
    displayName: '📋 Stage 1 - Terraform Init, Validate & Plan'
    jobs:
      - job: TerraformChecks
        displayName: 'Terraform Checks & Plan'
        steps:

          - checkout: self
            fetchDepth: 0
            displayName: '📥 Checkout Repository'

          - task: PowerShell@2
            displayName: '🔎 Identify Modified Terraform Folders'
            inputs:
              targetType: 'inline'
              script: |
                # For practice pipelines, we fallback to TF_WORKING_DIR
                $Changed = "$(TF_WORKING_DIR)"
                Write-Host "Changed folders: $Changed"
                Write-Host "##vso[task.setvariable variable=CHANGED_FOLDERS]$Changed"

          - task: AzureCLI@2
            displayName: '🔑 Azure Login'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az account show --query "{name:name, id:id}" -o table

          - task: TerraformInstaller@1
            displayName: '🔧 Setup Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: '🚀 Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(TF_WORKING_DIR)
              backendServiceArm: $(azureServiceConnection)
              backendAzureRmResourceGroupName: $(backendResourceGroup)
              backendAzureRmStorageAccountName: $(backendStorageAccount)
              backendAzureRmContainerName: $(backendContainer)
              backendAzureRmKey: $(backendKey)

          - task: TerraformTaskV4@4
            displayName: '🎨 Terraform Format Check'
            inputs:
              provider: 'azurerm'
              command: 'custom'
              workingDirectory: $(TF_WORKING_DIR)
              customCommand: 'fmt'
              commandOptions: '-check -recursive'
            continueOnError: true

          - task: TerraformTaskV4@4
            displayName: '✅ Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: $(TF_WORKING_DIR)

          - task: PowerShell@2
            displayName: '🔬 Install & Run TFLint'
            inputs:
              targetType: 'inline'
              workingDirectory: $(TF_WORKING_DIR)
              script: |
                $url = "https://github.com/terraform-linters/tflint/releases/latest/download/tflint_windows_amd64.zip"
                Invoke-WebRequest -Uri $url -OutFile "$(Agent.TempDirectory)\tflint.zip"
                Expand-Archive -Path "$(Agent.TempDirectory)\tflint.zip" -DestinationPath "$(Agent.TempDirectory)\tflint" -Force
                & "$(Agent.TempDirectory)\tflint\tflint.exe" --init
                & "$(Agent.TempDirectory)\tflint\tflint.exe" --format compact
            continueOnError: true

          - task: TerraformTaskV4@4
            displayName: '📐 Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: $(TF_WORKING_DIR)
              environmentServiceNameAzureRM: $(azureServiceConnection)
              commandOptions: '-input=false -out=tfplan'

          - task: TerraformTaskV4@4
            displayName: '📄 Export Plan as JSON'
            inputs:
              provider: 'azurerm'
              command: 'custom'
              workingDirectory: $(TF_WORKING_DIR)
              customCommand: 'show'
              commandOptions: '-json tfplan'
              outputTo: 'console'
            env:
              TF_LOG: ''

          - task: PowerShell@2
            displayName: '💰 Cost Estimate (Azure Retail Prices API)'
            inputs:
              targetType: 'inline'
              workingDirectory: $(TF_WORKING_DIR)
              script: |
                Write-Host "##[group]Generate plan JSON"
                terraform show -json tfplan > plan.json
                Write-Host "Plan JSON generated"
                Write-Host "##[endgroup]"

                Write-Host "##[group]Extract planned resource types"
                $plan = Get-Content -Raw -Path plan.json | ConvertFrom-Json
                $types = @()
                if ($plan.resource_changes) {
                    foreach ($r in $plan.resource_changes) {
                        if ("create" -in $r.change.actions -or "update" -in $r.change.actions) {
                            $types += $r.type
                        }
                    }
                }
                $types = $types | Select-Object -Unique
                Write-Host "Resource types to be created/updated:"
                $types | ForEach-Object { Write-Host $_ }
                Write-Host "##[endgroup]"

                Write-Host "##[group]Query Azure Retail Prices API"
                foreach ($t in $types) {
                    $service = ""
                    switch -Wildcard ($t) {
                        "azurerm_*_virtual_machine" { $service = "Virtual Machines" }
                        "azurerm_storage_account"   { $service = "Storage" }
                        "azurerm_*sql_database"     { $service = "SQL Database" }
                        "azurerm_kubernetes_cluster"{ $service = "Azure Kubernetes Service" }
                        "azurerm_*web_app"          { $service = "App Service" }
                        "azurerm_app_service"       { $service = "App Service" }
                        default                     { $service = "" }
                    }

                    if ($service) {
                        Write-Host "`n🔍 $t → querying: $service"
                        $url = "https://prices.azure.com/api/retail/prices?`$filter=serviceName eq '$service' and priceType eq 'Consumption' and currencyCode eq 'USD'"
                        $resp = Invoke-RestMethod -Uri $url
                        $items = $resp.Items | Select-Object -First 5
                        if ($items.Count -eq 0) { Write-Host "  No pricing data found." }
                        foreach ($item in $items) {
                            $ret = "{0:N4}" -f $item.retailPrice
                            Write-Host "  SKU: $($item.skuName) | Region: $($item.armRegionName) | `$$ret/$($item.unitOfMeasure)"
                        }
                    } else {
                        Write-Host "⚪ $t - no pricing mapping"
                    }
                }
                Write-Host "##[endgroup]"

          - task: PowerShell@2
            displayName: '🏷️ Create Plan Slug'
            inputs:
              targetType: 'inline'
              script: |
                $slug = "$(TF_WORKING_DIR)".Replace('\', '-').Replace('/', '-').TrimStart('-')
                Write-Host "##vso[task.setvariable variable=PLAN_SLUG]$slug"

          - task: PublishPipelineArtifact@1
            displayName: '📦 Upload Terraform Plan'
            inputs:
              targetPath: '$(TF_WORKING_DIR)/tfplan'
              artifact: 'tfplan-$(PLAN_SLUG)'
              publishLocation: 'pipeline'

# ============================================================
#  STAGE 2 – Security Scanning
# ============================================================
  - stage: SecurityScan
    displayName: '🔐 Stage 2 - Security Scanning'
    dependsOn: []
    condition: succeeded()
    jobs:
      - job: SecretAndVulnerabilityScan
        displayName: 'Secret & Vulnerability Scans'
        steps:
          - checkout: self
            fetchDepth: 0
            displayName: '📥 Checkout Repository'

          - task: PowerShell@2
            displayName: '🔑 Install & Run Gitleaks'
            inputs:
              targetType: 'inline'
              script: |
                $latest = (Invoke-RestMethod https://api.github.com/repos/gitleaks/gitleaks/releases/latest).tag_name.Substring(1)
                $url = "https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_$($latest)_windows_x64.zip"
                Invoke-WebRequest -Uri $url -OutFile "$(Agent.TempDirectory)\gitleaks.zip"
                Expand-Archive -Path "$(Agent.TempDirectory)\gitleaks.zip" -DestinationPath "$(Agent.TempDirectory)\gitleaks" -Force
                & "$(Agent.TempDirectory)\gitleaks\gitleaks.exe" detect --source . --config "$(System.DefaultWorkingDirectory)\terraform-pipeline\.gitleaks.toml" --report-format junit --report-path "$(Agent.TempDirectory)\gitleaks-report.xml" --exit-code 0
            continueOnError: true

          - task: PublishTestResults@2
            displayName: '📊 Publish Gitleaks Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(Agent.TempDirectory)\gitleaks-report.xml'
              testRunTitle: 'Gitleaks Secret Scan'
            condition: always()

          - task: PowerShell@2
            displayName: '🐷 Install & Run TruffleHog'
            inputs:
              targetType: 'inline'
              script: |
                $latest = (Invoke-RestMethod https://api.github.com/repos/trufflesecurity/trufflehog/releases/latest).tag_name.Substring(1)
                $url = "https://github.com/trufflesecurity/trufflehog/releases/latest/download/trufflehog_$($latest)_windows_amd64.tar.gz"
                Invoke-WebRequest -Uri $url -OutFile "$(Agent.TempDirectory)\trufflehog.tar.gz"
                New-Item -ItemType Directory -Force -Path "$(Agent.TempDirectory)\trufflehog"
                tar.exe -xzf "$(Agent.TempDirectory)\trufflehog.tar.gz" -C "$(Agent.TempDirectory)\trufflehog"
                & "$(Agent.TempDirectory)\trufflehog\trufflehog.exe" git file://. --only-verified --fail
            continueOnError: true

          - task: PowerShell@2
            displayName: '🔍 Install & Run tfsec'
            inputs:
              targetType: 'inline'
              script: |
                $url = "https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-windows-amd64.exe"
                Invoke-WebRequest -Uri $url -OutFile "$(Agent.TempDirectory)\tfsec.exe"
                & "$(Agent.TempDirectory)\tfsec.exe" "$(TF_WORKING_DIR)" --format junit --out "$(Agent.TempDirectory)\tfsec-results.xml" --exit-code 0
            continueOnError: true

          - task: PublishTestResults@2
            displayName: '📊 Publish tfsec Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(Agent.TempDirectory)\tfsec-results.xml'
              testRunTitle: 'tfsec IaC Scan'
            condition: always()

          - task: PowerShell@2
            displayName: '🔭 Install & Run Trivy'
            inputs:
              targetType: 'inline'
              script: |
                $latest = (Invoke-RestMethod https://api.github.com/repos/aquasecurity/trivy/releases/latest).tag_name.Substring(1)
                $url = "https://github.com/aquasecurity/trivy/releases/latest/download/trivy_$($latest)_windows-64bit.zip"
                Invoke-WebRequest -Uri $url -OutFile "$(Agent.TempDirectory)\trivy.zip"
                Expand-Archive -Path "$(Agent.TempDirectory)\trivy.zip" -DestinationPath "$(Agent.TempDirectory)\trivy" -Force
                & "$(Agent.TempDirectory)\trivy\trivy.exe" config "$(TF_WORKING_DIR)" --format table --exit-code 0 --severity CRITICAL,HIGH
            continueOnError: true

# ============================================================
#  STAGE 3 – Manual Approval Gate
# ============================================================
  - stage: ManualApproval
    displayName: '🙋 Stage 3 - Manual Approval'
    dependsOn:
      - TerraformPlan
      - SecurityScan
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/master')
      )
    jobs:
      - deployment: WaitForApproval
        displayName: 'Await Human Approval'
        environment: $(environmentName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: PowerShell@2
                  displayName: '✅ Approval Confirmed'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Write-Host "=============================================="
                      Write-Host "  ✅ Approval received! Proceeding to Apply..."
                      Write-Host "=============================================="
                      Write-Host "Approved by:  $(Build.RequestedFor)"
                      Write-Host "Build Number: $(Build.BuildNumber)"
                      Write-Host "Branch:       $(Build.SourceBranchName)"
                      Write-Host "Commit:       $(Build.SourceVersion)"

# ============================================================
#  STAGE 4 – Terraform Apply
# ============================================================
  - stage: TerraformApply
    displayName: '🚀 Stage 4 - Terraform Apply'
    dependsOn: ManualApproval
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/master')
      )
    jobs:
      - deployment: TerraformApplyJob
        displayName: 'Terraform Apply'
        environment: $(environmentName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: '🔑 Azure Login'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'ps'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az account show --query "{name:name, id:id}" -o table

                - task: TerraformInstaller@1
                  displayName: '🔧 Setup Terraform'
                  inputs:
                    terraformVersion: 'latest'

                - task: TerraformTaskV4@4
                  displayName: '🚀 Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: $(TF_WORKING_DIR)
                    backendServiceArm: $(azureServiceConnection)
                    backendAzureRmResourceGroupName: $(backendResourceGroup)
                    backendAzureRmStorageAccountName: $(backendStorageAccount)
                    backendAzureRmContainerName: $(backendContainer)
                    backendAzureRmKey: $(backendKey)

                - task: PowerShell@2
                  displayName: '🏷️ Create Plan Slug'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $slug = "$(TF_WORKING_DIR)".Replace('\', '-').Replace('/', '-').TrimStart('-')
                      Write-Host "##vso[task.setvariable variable=PLAN_SLUG]$slug"

                - task: DownloadPipelineArtifact@2
                  displayName: '⬇️ Download Terraform Plan'
                  inputs:
                    artifact: 'tfplan-$(PLAN_SLUG)'
                    path: '$(TF_WORKING_DIR)'

                - task: TerraformTaskV4@4
                  displayName: '⚡ Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: $(TF_WORKING_DIR)
                    environmentServiceNameAzureRM: $(azureServiceConnection)
                    commandOptions: '-auto-approve tfplan'
